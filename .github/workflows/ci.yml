name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: livepulse
          POSTGRES_USER: livepulse
          POSTGRES_PASSWORD: livepulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U livepulse -d livepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://livepulse:livepulse@localhost:5432/livepulse
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      LIVEPULSE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Start Redpanda
        run: |
          docker run -d --name livepulse-redpanda -p 9092:9092 redpandadata/redpanda:v25.2.1 redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false --kafka-addr external://0.0.0.0:9092 --advertise-kafka-addr external://127.0.0.1:9092
          timeout 60 docker exec livepulse-redpanda rpk cluster health --exit-when-healthy
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff check app tests alembic
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
