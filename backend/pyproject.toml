[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "livepulse-backend"
version = "0.1.0"
description = "LivePulse realtime event platform"
requires-python = ">=3.13"
dependencies = [
  "aiokafka>=0.12,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uuid6>=2024.7.10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.21,<1", "pytest>=8.3,<9", "pytest-asyncio>=1.0,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
